[project]
name = "imitation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Karnis Fatema", email = "karnis052@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "gym-pusht>=0.1.6",
    "gymnasium>=1.3.0",
    "imageio>=2.37.4",
    "imageio-ffmpeg>=0.6.0",
    "modal>=1.5.5",
    "numpy>=2.5.3",
    "pymunk<7",
    "torch>=2.14.0",
    "wandb>=0.30.0",
    "zarr>=3.4.0",
]

[project.scripts]
imitation = "imitation.train:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
